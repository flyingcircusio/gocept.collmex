name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ "opened", "reopened", "synchronize" ]
  schedule:
    - cron: '0 12 * * 0'  # run once a week on Sunday
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # These envs run against the faux Collmex server shipped with this
  # package, so there is no shared resource and they can run in
  # parallel.
  tests:
    strategy:
      fail-fast: false
      matrix:
        config:
        # [Python version, tox env]
        - ["3.11",   "py311"]
        - ["3.12",   "py312"]
        - ["3.13",   "py313"]
        - ["3.14",   "py314"]
        - ["3.15",   "py315"]
        - ["pypy3.11", "pypy3"]
        - ["3.14",   "coverage"]
    runs-on: ubuntu-latest
    name: ${{ matrix.config[1] }}
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.config[0] }}
        enable-cache: true
    - name: Install tox
      run: uv tool install tox --with tox-uv
    - name: Test
      run: tox -e ${{ matrix.config[1] }}
    - name: Coverage
      if: matrix.config[1] == 'coverage'
      run: uvx coveralls --service=github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The live test connects to the Collmex test system, which is shared
  # with other projects: never run more than one at a time. GitHub has
  # no resource groups; this job-level concurrency group is the closest
  # equivalent.
  tests-live:
    name: py312-live
    runs-on: ubuntu-latest
    concurrency:
      group: collmex-test-account
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - name: Decrypt config
      run: ./.github/scripts/decrypt_collmex_ini.sh
      env:
        GPG_PASSWORD_COLLMEX_INI: ${{ secrets.GPG_PASSWORD_COLLMEX_INI }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Install tox
      run: uv tool install tox --with tox-uv
    - name: Test
      run: tox -e py312-live
