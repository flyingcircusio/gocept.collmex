[tox]
envlist =
    flake8,
    py311,
    py312,
    py313,
    py314,
    py315,
    pypy3,
    coverage
minversion = 4.22
requires =
    tox-uv >= 1.25

[testenv]
usedevelop = true
extras = test
dependency_groups = dev
allowlist_externals =
    test
    echo
# Prevent parallel runs by testing if the according variable is set:
commands=
    echo "Parallel execution stops at the next line as the tests have to run sequentially:"
    test -z {env:TOX_PARALLEL_ENV:}
    py.test []
# Tests run against the faux Collmex server shipped with this package
# (see gocept.collmex.faux); the autouse faux_collmex_auto fixture in
# conftest.py starts it. The py3xx-live environments opt out and use
# the live Collmex test system instead; they require collmex.ini to be
# present:

[testenv:py312-live]
basepython = python3.12
setenv =
    COLLMEX_FAUX = 0
    COLLMEX_TEST_LIVE = 1

[testenv:coverage]
basepython = python3
dependency_groups = dev
commands =
    py.test --cov=src --cov-report=term-missing --cov-report=html []

[testenv:flake8]
basepython=python3
dependency_groups = dev
commands=flake8 src --doctest
