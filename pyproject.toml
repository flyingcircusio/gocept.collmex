[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "gocept.collmex"
version = "3.0.dev0"
description = "Python-bindings for the Collmex import/export API"
readme = "README.rst"
license = "ZPL-2.1"
authors = [
    { name = "gocept", email = "mail@gocept.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "gocept.cache >= 0.6.1",
    "transaction >= 1.4",
    "zope.deprecation >= 4.0",
    "zope.interface >= 4.0",
    "webtest >= 2.0",
    "wsgiproxy2",
]

[project.urls]
Homepage = "https://github.com/gocept/gocept.collmex"
Changelog = "https://github.com/gocept/gocept.collmex/blob/main/CHANGES.rst"
"Issue Tracker" = "https://github.com/gocept/gocept.collmex/issues"

[project.optional-dependencies]
test = [
    "mock >= 1.0",
    "zope.testing >= 4.0",
]

[dependency-groups]
dev = [
    "coverage",
    "flake8",
    "pytest",
    "pytest-cov",
    "pytest-instafail",
    "pytest-rerunfailures",
    "pytest-timeout",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["gocept*"]

[tool.pytest.ini_options]
addopts = "src -x --timeout=60 --instafail --reruns 2 --doctest-modules --doctest-glob=*.rst"

[tool.coverage.run]
branch = true
source = ["gocept.collmex"]

[tool.coverage.report]
precision = 2
exclude_lines = ["pragma: no cover"]

[tool.coverage.html]
directory = "coverage-report"

[tool.isort]
lines_between_sections = 0
lines_after_imports = 2
no_sections = true
from_first = true
lines_between_types = 0
force_single_line = true
